name: Build Windows

# 两种触发方式：
#   1) Actions 页面手动点「Run workflow」
#   2) push 一个 v* 标签（如 git tag v1.0.2 && git push --tags）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest # GitHub 提供的 Windows Server 镜像（自带 MSVC + Windows SDK）

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust（MSVC 工具链）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 准备 Windows 版 ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $zip = "$env:TEMP\ffmpeg-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive $zip -DestinationPath "$env:TEMP\ffmpeg-win64" -Force
          $exe = Get-ChildItem "$env:TEMP\ffmpeg-win64" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到 ffmpeg.exe" }
          Copy-Item $exe.FullName bin\ffmpeg.exe -Force
          Write-Host "ffmpeg 已就位：bin\ffmpeg.exe"

      - name: 构建安装包（NSIS + MSI）
        run: npx tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: VTManager-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
