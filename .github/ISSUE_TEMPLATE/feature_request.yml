name: 💡 功能建议
description: 提出新功能或改进现有功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！💡
        提交前请先搜索[已有 Issue](https://github.com/QuinnLSY/VTManager/issues)，看看是否已被讨论过。
        如果是使用上的疑问，请到 [Discussions](https://github.com/QuinnLSY/VTManager/discussions) 交流。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的痛点或场景，而不是直接给方案——这有助于我们找到更好的解法
      placeholder: 每次想找某个演员的电影时，都要手动翻很多目录……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望应用提供什么样的能力？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你是否尝试过其他做法？效果如何？

  - type: dropdown
    id: area
    attributes:
      label: 所属模块
      options:
        - 浏览与搜索
        - 视频播放
        - 图片查看
        - 文件管理（重命名 / 移动 / 删除）
        - 标签 / 收藏 / 归类
        - 设置与存储维护
        - 界面与交互
        - 性能
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考截图、类似软件的实现、或其他想说明的内容
